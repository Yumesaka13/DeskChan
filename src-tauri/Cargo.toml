[package]
name = "deskchan"
version = "0.2.0"
edition = "2021"

[lib]
name = "deskchan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Required when building a portable release executable outside Tauri's
# installer flow: embed `frontendDist` instead of loading `build.devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ts-rs = { version = "10", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
notify = "8"

[target.'cfg(windows)'.dependencies]
# No external crate needed - we use raw Win32 FFI in window_manager.rs
# to avoid version conflicts with Tauri's internal windows-core dependency.
