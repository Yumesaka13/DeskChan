[package]
name = "deskchan"
version = "0.2.1"
edition = "2021"

[lib]
name = "deskchan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Required when building a portable release executable outside Tauri's
# installer flow: embed `frontendDist` instead of loading `build.devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ts-rs = { version = "10", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
base64 = "0.22"
notify = "8"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
winreg = "0.55"
windows-version = "0.1"
windows = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Power", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
